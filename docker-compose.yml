version: "3.9"

volumes:
  x11: {}

x-sc-lio-common: &sc_lio_common
  build:
    context: .
    dockerfile: Dockerfile
  image: slam-sc-lio:noetic
  tty: true
  privileged: true
  volumes:
    # UPDATE to your download folder directory
    - x11:/tmp/.X11-unix
    - ./mulran/:/data/mulran:ro
    - ./output:/output
    - ./run_eval_ros1.sh:/run_eval_ros1.sh
    - ./run_sweep.sh:/run_sweep.sh
    - ./odom_to_tum.py:/odom_to_tum.py
    - ./helpers/:/helpers
    - ./mulran_eval/:/mulran_eval
    - ./record_mulran_input.sh:/record_mulran_input.sh
    - ./extract-trajectory:/extract-trajectory

services:
  gtsam-base:
    image: gtsam-base:noetic
    build:
      context: .
      dockerfile: Dockerfile.gtsam.noetic
  # Xquartz doesn't work on rviz use vnc on browser instead
  novnc:
    image: accetto/ubuntu-vnc-xfce:latest
    environment:
      - RESOLUTION=1600x900
      - VNC_COL_DEPTH=24
      - ENABLE_CRASHREPORTER=false
      - TZ=UTC
      - VNC_PW=123456
    volumes:
      - x11:/tmp/.X11-unix
    ports:
      - "8080:6901"

  sc-lio-mac:
    <<: *sc_lio_common
    profiles: ["mac"]
    environment:
      - DISPLAY=:1
      - QT_X11_NO_MITSHM=1
    depends_on:
      - novnc

  sc-lio-linux:
    <<: *sc_lio_common
    profiles: ["linux"]
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      # UPDATE to your download folder directory
      - ./mulran/:/data/mulran:ro
      - ./output:/output
      - ./run_eval_ros1.sh:/run_eval_ros1.sh
      - ./run_sweep.sh:/run_sweep.sh
      - ./odom_to_tum.py:/odom_to_tum.py
      - ./helpers/:/helpers
      - ./mulran_eval/:/mulran_eval
      - ./record_mulran_input.sh:/record_mulran_input.sh
      - ./extract-trajectory:/extract-trajectory